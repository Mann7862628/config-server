server:
  port: 8081
  

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            
          #Account-service
            - id: ACCOUNT-SERVICE
              uri: lb://ACCOUNT-SERVICE
              predicates: 
                - Path=/accounts/**
     
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
        
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true