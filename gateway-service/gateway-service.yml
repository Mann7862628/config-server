server:
  port: 8081
  

spring:
  application:
    name: gateway-service

  config:
    import: configserver:http://localhost:8888
    
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    
    
  cloud:
    gateway:
      server:
        webflux:
          routes:
            
          #Account-service
            - id: ACCOUNT-SERVICE
              uri: lb://ACCOUNT-SERVICE
              predicates: 
                - Path=/accounts/**
     
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway